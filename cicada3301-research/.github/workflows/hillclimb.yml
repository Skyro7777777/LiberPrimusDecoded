name: Long-Running Quagmire III Hill-Climber

on:
  workflow_dispatch:
    inputs:
      identity:
        description: 'Identity rune (NG/W/TH/ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - NG
          - W
          - TH
          - ALL
      restarts:
        description: 'Number of restarts'
        required: true
        default: '50'
        type: string
      iterations:
        description: 'Iterations per restart'
        required: true
        default: '20000'
        type: string
      sample:
        description: 'Sample length (runes)'
        required: true
        default: '1000'
        type: string
      page:
        description: 'Specific page (empty=full corpus)'
        required: false
        default: ''
        type: string

jobs:
  hillclimb:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone aldegonde for n-gram data
        run: |
          mkdir -p solvers
          cd solvers
          git clone --depth 1 https://github.com/cicada-solvers/aldegonde.git

      - name: Run hill-climber
        run: |
          cd decoder
          python3 long_hillclimb.py \
            --identity "${{ github.event.inputs.identity }}" \
            --restarts "${{ github.event.inputs.restarts }}" \
            --iterations "${{ github.event.inputs.iterations }}" \
            --sample "${{ github.event.inputs.sample }}" \
            --page "${{ github.event.inputs.page }}" \
            --save "long_hillclimb_results.json" \
            --seed 42

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hillclimb-results-${{ github.event.inputs.identity }}
          path: decoder/long_hillclimb_results.json

      - name: Commit results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add decoder/long_hillclimb_results.json
          git commit -m "CI: Hill-climb results (${{ github.event.inputs.identity }}, $(date -u '+%Y-%m-%d %H:%M'))" || echo "Nothing to commit"
          git push
